name: 股市直播 · 固定页部署 (CF Pages)

# 架构升级 V1.9.42（方案 ③）：页面固定 + 数据走云端接口动态刷新。
#   · 线上固定页（pages.dev）**不再每轮重建部署** → 零 Pages 构建额度消耗（用户多个项目共用 Pages 额度）。
#   · 直播数据由本地 Mac 循环每轮产出 live_data.json → 推到 GitHub 的 `data` 分支
#     （非 Pages 生产分支，不触发构建）→ 线上页首屏异步拉取并轮询刷新。
#   · 本 workflow 只在「改了外壳/管线并推 main」时跑一次，把固定页部署上去；
#     日常数据更新完全不经过 Pages 构建。
on:
  workflow_dispatch: {}          # 允许手动触发（首次部署 / 改外壳后重部署）
  push:
    branches: [main]            # 推 main = 重新部署固定页（仅外壳变更时发生，不会每轮触发）

permissions:
  contents: read
  actions: read     # actions/cache 需要，默认 token 被 permissions 覆盖后必须显式给

# 不取消进行中的轮次：避免重叠运行同时写 data/ 状态导致页面数据错位
concurrency:
  group: live-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI runner 默认 TZ=UTC → 全管线（场次判定 / 时间戳 / 交易日）会错位 8 小时，必须对齐北京时间。
      # 详见 ci_run_once.sh 顶部「时区铁律」(V1.9.39)。
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 跨轮持久化：restore 取最近一次 live-state-*；save 以 run_id 写新条目
      - name: Restore state cache (data/)
        uses: actions/cache@v4
        with:
          path: data
          key: live-state-${{ github.run_id }}
          restore-keys: |
            live-state-

      - name: Run pipeline (one round, builds the fixed shell)
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          EULERPOOL_API_KEY: ${{ secrets.EULERPOOL_API_KEY }}
          COLLECT_CN: auto
          ENGINE: api
          PRESET: agnes
        run: bash ci_run_once.sh

      - name: Save state cache
        uses: actions/cache@v4
        with:
          path: data
          key: live-state-${{ github.run_id }}

      - name: Ensure Pages project exists (idempotent)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create wolong-live --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name wolong-live
